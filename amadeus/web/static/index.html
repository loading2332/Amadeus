<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Amadeus Web Chat</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <h1>Amadeus</h1>
          <p id="sessionLabel"></p>
        </div>
        <span id="statusBadge" class="badge">idle</span>
      </header>

      <section id="messages" class="messages" aria-live="polite"></section>

      <form id="composer" class="composer">
        <textarea
          id="messageInput"
          rows="1"
          placeholder="输入消息..."
          autocomplete="off"
        ></textarea>
        <button id="sendButton" type="submit">发送</button>
      </form>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>

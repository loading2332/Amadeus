services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: amadeus
      POSTGRES_USER: amadeus
      POSTGRES_PASSWORD: amadeus
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amadeus -d amadeus"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
